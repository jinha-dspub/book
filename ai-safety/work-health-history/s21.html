<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 · 마리 세라피크호 — 일과 건강의 역사와 AI</title>
<link rel="stylesheet" href="scene.css">
<style>
  .viewport { background: #0F1216; }
  .rig img { object-fit: contain; }          /* the sheet is portrait: it sits in the middle 40% of the stage */
  .rig .mk { position: absolute; border: 2px solid var(--red); border-radius: 10px; box-shadow: 0 0 24px rgba(230,43,30,.5); opacity: 0; transition: opacity .8s .9s; pointer-events: none; }
  .rig .mk.on { opacity: 1; }
  #mkCalle { left: 32.5%; top: 14%; width: 15%; height: 42%; }
  #mkEntre { left: 49.5%; top: 14%; width: 8.6%; height: 42%; }
  #mkPont  { left: 58.8%; top: 14%; width: 9.5%; height: 42%; }
  #mkShip  { left: 30.5%; top: 57%; width: 39%; height: 25%; }
  .card.ex { right: 38px; top: 84px; width: 520px; border-left-color: var(--gold); }
  .card.ex.out-right { transform: translateX(115%); }
  .card .k { font: 700 11px var(--mono); letter-spacing: .1em; color: var(--gold); margin-bottom: 10px; }
  .card .t { font: 700 24px/1.3 var(--sans); letter-spacing: -.02em; margin-bottom: 10px; }
  .card p { font-size: 15.5px; line-height: 1.6; color: #CBD5E1; }
  .card p b { color: var(--text); }
  .card .ex-red { color: #FF9B94; }
  /* step 5: the ledger, as its own crisp image, with the three words */
  .ledger { position: absolute; left: 38px; right: 38px; top: 150px; height: 300px; z-index: 34; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.7);
            opacity: 0; transform: translateY(20px); transition: opacity .9s var(--ease-out), transform .9s var(--ease-out); }
  .ledger.on { opacity: 1; transform: none; }
  .ledger img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
  .three { position: absolute; left: 38px; right: 38px; bottom: 96px; z-index: 36; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .three .line { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 16px 18px; }
  .three .line .n { font: 700 11px var(--mono); color: var(--muted); letter-spacing: .1em; margin-bottom: 6px; }
  .three .line .w { font: 700 22px/1.2 var(--sans); letter-spacing: -.02em; }
  .three .line:nth-child(3) { border-top-color: var(--red); } .three .line:nth-child(3) .w { color: #FF9B94; }
  .head h2, .head .kick { text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .source { left: 38px; bottom: 70px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport">
    <div class="rig" id="rig">
      <img src="assets/img/marie_seraphique.jpg" alt="Plan, profil et distribution du navire La Marie-Séraphique (약 1770)">
      <div class="mk" id="mkCalle"></div><div class="mk" id="mkEntre"></div><div class="mk" id="mkPont"></div><div class="mk" id="mkShip"></div>
    </div>
    <div class="vignette" id="vig"></div>
  </div>
  <div class="head"><div class="kick">02 Sweet and Speed</div><h2>마리 세라피크호 — 앙골라에서 아이티로</h2></div>

  <div class="card ex out-right" id="ex">
    <div class="k" id="exK"></div><div class="t" id="exT"></div><p id="exP"></p>
  </div>

  <div class="ledger" id="ledger"><img src="assets/img/seraphique_ledger.jpg" alt="같은 도판의 거래표 확대"></div>
  <div class="three lines" id="three">
    <div class="line"><div class="n">01</div><div class="w">기록된 거래</div></div>
    <div class="line"><div class="n">02</div><div class="w">배치된 신체</div></div>
    <div class="line"><div class="n">03</div><div class="w">알기 어려운 경험</div></div>
  </div>
  <div class="source" id="src">출처: La Marie-Séraphique · Nantes 역사박물관, 약 1770 · 거래표 수치는 판독하지 않음</div>

</div>

<script src="scene.js"></script>
<script>
  // image box inside the 1280×720 rig: portrait 900×1255 → 516 px wide, centred → x from 29.8% to 70.2%
  const ix = px => 29.84 + px * .4031;   // image-x% → rig-x%
  const EX = [
    null,
    { k: 'PLANS DE LA CALLE — 선창', t: '배의 가장 밑바닥', p: '물통과 식량통(Barrels)이 <b>빈틈없이</b> 채워져 있다. 항해를 위한 \'연료\'다.' },
    { k: 'L\'ENTRE-PONT — 중갑판', t: '바로 그 위층, 사람', p: '여기에는 <b>사람(노예)</b>들이 빈틈없이 채워져 있다. 작가는 물통(왼쪽)과 사람(중앙)을 똑같은 <span class="ex-red">\'적재 화물\'</span>로서 시각적으로 동일하게 묘사했다. 그들에게 흑인은 상품이었다.' },
    { k: 'LE PONT — 갑판 · 측면도', t: '겉모습은 우아한 범선', p: '갑판 뒤쪽 바리케이드가 승무원 구역과 노예 구역을 물리적으로 분리한다. 가운데 측면도 — 해안에 평화롭게 정박해 프랑스 왕실 깃발이 펄럭인다. 문명의 상징 같지만, 그 <b>뱃속</b>은? <b>"화려한 문명이 무엇으로 유지되었는지"</b>에 대한 그림.' },
    { k: 'TABLEAU GÉNÉRAL — 그림 아래의 장부', t: '사람을 \'숫자\'로', p: '싣고 간 상품(직물, 무기 등)의 목록과, 그것을 주고 산 <b>307명의 캡티브</b>, 그중 몇 명이 죽고 몇 명이 살아서 설탕 농장에 팔렸는지의 <span class="ex-red">\'수익률 계산\'</span>. 숫자를 하나하나 읽기보다, 이 도면이 어떤 종류의 정보를 한데 묶었는지 본다.' },
  ];
  Scene.init({
    id: '21', meta: '02 Sweet and Speed', lit: 1,
    prev: 's20.html', next: 's22.html',
    steps: [
      { n: 'STEP 01', name: '도판 전체', title: '배 한 척의 설계도', header: '마리 세라피크호', dur: 5000,
        caption: '위에서부터 — 단면도 네 장, 측면도, 그리고 <span class="gold">장부</span>' },
      { n: 'STEP 02', name: '선창', title: '물통', header: '선창 — 항해의 연료', dur: 5500,
        caption: '가장 왼쪽, 배의 밑바닥 — <span class="gold">물통과 식량통</span>' },
      { n: 'STEP 03', name: '중갑판', title: '사람', header: '중갑판 — 물통과 같은 방식으로', dur: 7000,
        caption: '물통과 사람을 똑같은 <span class="red">\'적재 화물\'</span>로 그렸다' },
      { n: 'STEP 04', name: '갑판·측면도', title: '우아한 범선', header: '겉모습과 뱃속', dur: 6500,
        caption: '겉모습은 문명의 상징 — 그 <span class="gold">뱃속</span>은?' },
      { n: 'STEP 05', name: '장부', title: '사람을 숫자로', header: '다시 보기 — 그림 아래의 장부', dur: 9000,
        caption: '운송과 거래를 설명하는 정교함과, 강제로 이송된 사람의 경험을 이해하는 정교함은 <span class="gold">다르다</span>' },
    ],
    apply(i) {
      const cams = ['scale(1)', Scene.cam(ix(22), 33, 3.0, 36, 50), Scene.cam(ix(58), 33, 3.0, 36, 50), Scene.cam(ix(44), 73, 2.0, 34, 52), 'scale(1)'];
      rig.style.transform = cams[i];
      mkCalle.classList.toggle('on', i === 1); mkEntre.classList.toggle('on', i === 2); mkPont.classList.toggle('on', i === 3); mkShip.classList.toggle('on', i === 3);
      vig.classList.toggle('on', i >= 1 && i <= 3); vig.style.background = (i >= 1 && i <= 3) ? Scene.spot(36, 50, 12, 76) : '';
      ex.classList.toggle('out-right', !EX[i] || i === 4);
      if (EX[i] && i < 4) { exK.textContent = EX[i].k; exT.textContent = EX[i].t; exP.innerHTML = EX[i].p; }
      ledger.classList.toggle('on', i === 4); three.classList.toggle('show', i === 4);
      document.querySelector('.viewport').style.opacity = i === 4 ? .18 : 1;
    }
  });
</script>
</body>
</html>
