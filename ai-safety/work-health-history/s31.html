<div class="stage" id="stage">
  <div class="viewport">
    <div class="rig" id="rig"><img src="assets/img/rider_rain.jpg" alt="빗속의 라이더 — 연출 이미지(AI 생성)"></div>

  </div>
  <div class="head"><div class="kick">CHAPTER 2 · AI 시대의 루프</div><h2>현실의 루프</h2></div>

  <div class="card side out-left" id="side">
    <div class="k">같은 루프를 라이더의 자리에서</div>
    <div class="chain">
      <div>알고리즘이 <b>비현실적인 배달 시간</b>을 제시한다 — 폭우도, 고장 난 엘리베이터도 알고리즘은 모른다</div>
      <div>거부하면? <b>수락률</b>이 떨어진다 → 콜이 끊긴다 → 소득이 끊긴다</div>
      <div>형식적으로는 in-the-loop 다 — 수락 버튼은 노동자가 누르니까</div>
    </div>
    <div class="sum">그러나 페트로프에게 있던 것 — <span class="gold">불이익 없이 판정을 뒤집을 권한</span> — 이 라이더에게는 없다</div>
  </div>

  <div class="thesis" id="thesis">노동자는 루프의 감독자가 아니라<br><b>루프의 충격 완충재(Shock Absorber)</b>가 되었다</div>
  <div class="source">연출 이미지 (AI 생성)</div>

</div>
