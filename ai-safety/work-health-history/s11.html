<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 · 다른 지도에서, 조금 더 가까이 — 일과 건강의 역사와 AI</title>
<link rel="stylesheet" href="scene.css">
<style>
  .viewport { background: var(--paper); }
  .rig img { object-fit: contain; background: var(--paper); filter: sepia(.25) contrast(1.02); }
  /* markers on the 1828 map (percent of the image box) */
  .mk { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; opacity: 0; transition: opacity .8s .9s; pointer-events: none; }
  .mk.owner { left: 60.3%; top: 47%; width: 180px; height: 56px; border-radius: 30px; border: 2px solid var(--red); box-shadow: 0 0 24px rgba(230,43,30,.45); }
  .mk.houses { left: 46%; top: 35%; width: 86px; height: 64px; border: 2px dashed #7C3AED; background: rgba(124,58,237,.12); border-radius: 14px; }
  .mk.houses2 { left: 47%; top: 57%; width: 120px; height: 46px; border: 2px dashed #7C3AED; background: rgba(124,58,237,.12); border-radius: 14px; }
  .mk.on { opacity: 1; }
  .head h2, .head .kick { text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .head h2 { color: #2B261F; } .head .kick { color: #9A2A1F; }
  .lbl { position: absolute; z-index: 36; left: 38px; bottom: 100px; width: 520px; }
  .lbl .line { background: rgba(7,10,14,.88); backdrop-filter: blur(10px); border-left: 3px solid var(--gold); border-radius: 8px; padding: 12px 16px; margin-top: 10px; font-size: 16px; line-height: 1.5; }
  .lbl .line b { color: var(--gold); font-weight: 700; }
  /* step 4: the satellite card slides in from the right; the map parks on the left */
  .card.sat { right: 38px; top: 84px; bottom: 92px; width: 560px; padding: 0; overflow: hidden; border-left-color: var(--green); }
  .card.sat img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block; }
  .card.sat .tag { position: absolute; left: 16px; top: 14px; }
  .card.sat .coord { position: absolute; right: 16px; bottom: 14px; font: 500 13px var(--mono); color: #D1FAE5; background: rgba(7,10,14,.7); padding: 4px 10px; border-radius: 6px; }
  .card.sat .pin { position: absolute; left: 50%; top: 62%; width: 18px; height: 18px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 6px rgba(230,43,30,.3), 0 0 30px rgba(230,43,30,.7); transform: translate(-50%, -50%); }
  .card.sat .pin::after { content: 'Romney Manor'; position: absolute; left: 24px; top: -4px; white-space: nowrap; font: 700 12px var(--sans); color: #fff; text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport" id="vp">
    <div class="rig" id="rig">
      <img src="assets/img/map1828_zoom.jpg" alt="McMahon map of St Kitts, 1828 — Wingfield and Romney (Hicks 2007, Fig. 15)">
      <div class="mk owner" id="mkOwner"></div><div class="mk houses" id="mkH1"></div><div class="mk houses2" id="mkH2"></div>
    </div>
    <div class="vignette" id="vig"></div>
  </div>
  <div class="head"><div class="kick">01 지도는 무엇을 기록했는가</div><h2>다른 지도에서, 조금 더 가까이</h2></div>

  <div class="lbl lines" id="lbl">
    <div class="line"><b>Earl Romney</b> — 소유자는 <b>이름</b>으로 적혀 있다</div>
    <div class="line"><b>Negro Houses</b> — 여러 사람의 거주지는 <b>집단의 범주와 기호</b>로</div>
    <div class="line">집은 지도에 있다. 그러나 그 집에 살던 사람의 이름, 피로, 통증, 다친 뒤의 생활은 — 이 그림에 없다</div>
  </div>

  <div class="card sat out-right" id="sat">
    <img src="assets/img/satellite_now.jpg" alt="같은 자리의 현재 위성사진">
    <span class="chip gold tag">같은 자리 · 현재</span>
    <div class="pin"></div>
    <div class="coord">17.326513, −62.802293</div>
  </div>

  <div class="source" style="left:38px;bottom:70px;color:#5B5246">출처: McMahon, 1828 · Hicks, 2007, Fig. 15 / UWM &nbsp;·&nbsp; 1779년 지도와 구분</div>

</div>

<script src="scene.js"></script>
<script>
  Scene.init({
    id: '11', meta: '01 지도는 무엇을 기록했는가', lit: 1,
    prev: 's10.html', next: 's12.html',
    steps: [
      { n: 'STEP 01', name: '1828 McMahon', title: '지역도 전체', header: '다른 지도에서, 조금 더 가까이', dur: 5000,
        caption: '1828년 McMahon 의 지도 — 조금 전의 1779년 지도와는 <span class="gold">다른 자료</span>다' },
      { n: 'STEP 02', name: '소유자의 이름', title: 'Earl Romney', header: '소유자의 이름 곁에', dur: 5500,
        caption: '소유자는 <span class="gold">이름</span>으로 등장한다' },
      { n: 'STEP 03', name: '작은 집들', title: 'Negro Houses — 점으로', header: '소유자의 이름 곁에 작은 집들이 있다', dur: 7000,
        caption: '여러 사람의 거주지는 <span class="gold">집단의 범주와 기호</span>로 — 당시 표기는 판독에 필요한 한 번만 읽는다' },
      { n: 'STEP 04', name: '같은 자리, 지금', title: '위성사진과 좌표', header: '이미 남은 기록으로 무엇을 알 수 없는가', dur: 6000,
        caption: '무엇을 기록해야 하는가라는 질문은, <span class="gold">남은 기록으로 무엇을 알 수 없는가</span>를 확인하는 데서 출발한다' },
    ],
    apply(i) {
      // camera: 2 → owner's name; 3 → the dots; 4 → park the houses on the left third while the satellite card comes in
      rig.style.transform = i === 0 ? 'scale(1)' : i === 1 ? Scene.cam(60.3, 47, 2.3, 50, 50) : i === 2 ? Scene.cam(46, 35.5, 2.8, 50, 50) : Scene.cam(46, 46, 2.4, 28, 50);
      mkOwner.classList.toggle('on', i === 1); mkH1.classList.toggle('on', i >= 2); mkH2.classList.toggle('on', i >= 2);
      vig.classList.toggle('on', i === 1 || i === 2); vig.style.background = i === 1 ? Scene.spot(50, 50, 14, 80, 'rgba(60,50,35') : i === 2 ? Scene.spot(50, 50, 12, 78, 'rgba(60,50,35') : '';
      lbl.classList.toggle('show', i >= 1);
      lbl.querySelectorAll('.line').forEach((l, k) => l.style.opacity = i >= 1 && k <= (i === 1 ? 0 : i === 2 ? 1 : 2) ? 1 : 0);
      sat.classList.toggle('out-right', i < 3);
      document.querySelector('.head h2').style.color = (i === 1 || i === 2) ? '#F8FAFC' : '';
    }
  });
</script>
</body>
</html>
