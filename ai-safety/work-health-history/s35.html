<div class="stage" id="stage">
  <div class="viewport">
    <div class="rig" id="rig"><img id="grid" src="assets/img/ocado_grid.jpg" alt="오카도(Ocado) 자동창고 — 사람 없는 로봇의 격자"></div>

  <div class="head"><div class="kick">CHAPTER 2 · AI 시대의 루프</div><h2>로봇의 격자, 그리고 화재</h2></div>

  <div class="thesis" id="thesis">무인 공간의 실패를 수습한 것도 — 결국, 사람이었다</div>

<script>
  Scene.init({
    id: '35', meta: 'CHAPTER 2 · AI 시대의 루프', lit: 2,

      { n: 'STEP 01', name: '격자', title: '사람이 한 명도 없다', header: '로봇의 격자', dur: 6000,
