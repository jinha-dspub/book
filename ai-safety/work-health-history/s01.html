<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 · 제목 — 일과 건강의 역사와 AI</title>
<link rel="stylesheet" href="scene.css">
<style>
  .viewport { background: radial-gradient(ellipse at 75% 60%, #0D141C 0%, var(--stage-bg) 62%); }
  /* faint grid of "dots on a map" — the people who were recorded as points; it comes back in S11 and S41 */
  .dots { position: absolute; inset: 0; opacity: .35; }
  .dots circle { fill: #1F2733; transition: fill 1.4s; }
  .dots.on circle:nth-child(7n) { fill: #3B4656; }
  .title { position: absolute; left: 38px; top: 50%; transform: translateY(-50%); width: 760px; z-index: 35; transition: transform .9s var(--ease-out), opacity .7s; }
  .title .bar { width: 46px; height: 4px; background: var(--red); margin-bottom: 26px; transform-origin: left; transform: scaleX(0); transition: transform .8s var(--ease-out) .2s; }
  .title.in .bar { transform: none; }
  .title h2 { font: 700 54px/1.15 var(--sans); letter-spacing: -.03em; margin-bottom: 18px; }
  .title .sub { font: 600 26px/1.35 var(--sans); color: var(--gold); margin-bottom: 34px; letter-spacing: -.01em; position: relative; display: inline-block; }
  .title .sub::after { content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: rgba(240,180,41,.6); transform: scaleX(0); transform-origin: left; transition: transform 1s var(--ease-out); }
  .title.ul .sub::after { transform: none; }
  .title .who { font-size: 16px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 14px; }
  .title .who b { color: var(--text); font-weight: 600; }
  .lines .line { transition-delay: 0s !important; }
  /* right: a visitor before a painting — plays once (6 s) when the scene opens, then rests on its last frame */
  .me { position: absolute; right: 38px; top: 50%; transform: translate(24px, -50%); width: 600px; background: #000; z-index: 34; border-radius: 14px; overflow: hidden;
        border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.65); opacity: 0; transition: opacity .9s var(--ease-out) .25s, transform 1s var(--ease-out) .25s; }
  .me.in { opacity: 1; transform: translate(0, -50%); }
  .me video { width: 100%; height: 338px; object-fit: cover; display: block; background: #000; }
  .me .cap { padding: 12px 16px 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 13px; line-height: 1.4; color: #CBD5E1; }
  .me .cap b { color: var(--text); font-size: 15px; display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport">
    <svg class="dots" id="dots" viewBox="0 0 1280 720" aria-hidden="true"></svg>
  </div>

  <div class="me" id="me"><video id="vid" muted playsinline preload="auto" poster="assets/img/s01_museum.jpg"><source src="assets/img/s01_museum.mp4" type="video/mp4"><source src="assets/img/s01_museum.webm" type="video/webm"></video><div class="cap"><b>그림 앞에 선 사람</b>쿠르베, 〈돌 깨는 사람들〉(1849) 앞에서 — 일하는 몸을 다시 보는 것. 연출 영상 (AI 생성, 7.5초)</div></div>

  <div class="title lines" id="title">
    <div class="bar"></div>
    <h2 class="line">일과 건강의 역사와 AI</h2>
    <div class="sub line">AI 시대, 무엇을 측정하고 기록할 것인가</div>
    <div class="who line"><b>윤진하</b> · 연세대학교 의과대학 산업보건연구소</div>
  </div>

</div>

<script src="scene.js"></script>
<script>
  // dot field on the right half
  (function () { let s = ''; for (let y = 40; y < 720; y += 36) for (let x = 700; x < 1280; x += 36) s += `<circle cx="${x + (y % 72 ? 18 : 0)}" cy="${y}" r="2.2"/>`; dots.innerHTML = s; })();
  Scene.init({
    id: '01', meta: '연세대학교 의과대학 산업보건연구소 · 윤진하', lit: 0,
    next: 's02.html',
    steps: [
      { n: 'STEP 01', name: '제목', title: '일과 건강의 역사와 AI', header: '일과 건강의 역사와 AI', dur: 5000,
        caption: 'AI 시대, 무엇을 측정하고 기록할 것인가' },
      { n: 'STEP 02', name: '바로 시작', title: '목차 없이, 이야기가 목차다', header: '일과 건강의 역사와 AI', dur: 5000,
        caption: '<span class="gold">지금 바로 보여드리고</span> 시작하겠습니다' },
    ],
    apply(i) {
      title.classList.add('in', 'show'); me.classList.add('in');
      if (i === 0) { vid.currentTime = 0; vid.play().catch(() => {}); }
      title.classList.toggle('ul', i >= 1);
      dots.classList.toggle('on', i >= 1);
    }
  });
</script>
</body>
</html>
