<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 · 200년 후, 같은 자리 — 일과 건강의 역사와 AI</title>
<link rel="stylesheet" href="scene.css">
<style>
  .viewport { background: #050709; }
  .pane { position: absolute; inset: 0; opacity: 0; transition: opacity 1s var(--ease-out); }
  .pane.on { opacity: 1; }
  .pane img { position: absolute; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,.6); transform: scale(.98); transition: transform 7s linear; }
  .pane.on img { transform: scale(1.02); }
  /* pane 1: bell tower, portrait-ish, centre */
  #p1 img { left: 300px; top: 160px; width: 680px; height: 400px; }
  /* pane 2: collage */
  #p2 img.a { left: 38px; top: 160px; width: 560px; height: 390px; }
  #p2 img.b { left: 618px; top: 160px; width: 624px; height: 200px; }
  #p2 img.c { left: 618px; top: 374px; width: 300px; height: 176px; }
  #p2 img.d { left: 942px; top: 374px; width: 300px; height: 176px; object-position: 50% 60%; }
  /* pane 3: Romney Manor */
  #p3 img.a { left: 38px; top: 160px; width: 740px; height: 400px; }
  #p3 img.b { left: 798px; top: 160px; width: 444px; height: 400px; }
  .tag { position: absolute; left: 38px; bottom: 100px; z-index: 36; }
  .tag .t { font: 700 26px/1.3 var(--sans); letter-spacing: -.02em; text-shadow: 0 4px 20px rgba(0,0,0,.9); }
  .tag .s { font-size: 14px; color: #CBD5E1; margin-top: 4px; text-shadow: 0 2px 8px #000; }
  .head h2, .head .kick { text-shadow: 0 2px 12px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport">
    <div class="pane" id="p1"><img src="assets/img/belltower_now.jpg" alt="현재의 벨타워 — Wingfield Estate"></div>
    <div class="pane" id="p2"><img class="a" src="assets/img/sugarworks_engraving.jpg" alt="설탕공장 판화"><img class="b" src="assets/img/ruins_garden.jpg" alt="설탕공장 유적"><img class="c" src="assets/img/mill_ruin_small.jpg" alt="압착기 유적"><img class="d" src="assets/img/sugarworks_engraving2.jpg" alt="Grinding cane using water power"></div>
    <div class="pane" id="p3"><img class="a" src="assets/img/romney_manor.jpg" alt="Romney Manor, Home of Caribelle Batik — 안내판"><img class="b" src="assets/img/romney_c.jpg" alt="Romney Manor 정원"></div>
  </div>
  <div class="head"><div class="kick">01 지도는 무엇을 기록했는가</div><h2>200년 후, 같은 자리</h2></div>
  <div class="tag" id="tag"><div class="t" id="tt"></div><div class="s" id="ts"></div></div>

</div>

<script src="scene.js"></script>
<script>
  const T = [['벨타워 — 종소리가 하루를 통제했다', 'Wingfield Estate, St. Kitts · 현재'], ['설탕을 짜고 끓이던 자리', '판화 속 공정과, 정비된 유적'], ['Romney Manor, Home of Caribelle Batik', '소유자의 저택은 — 공방과 정원이 있는 관광지가 되었다']];
  Scene.init({
    id: '12', meta: '01 지도는 무엇을 기록했는가', lit: 1,
    prev: 's11.html', next: 's13.html',
    steps: [
      { n: 'STEP 01', name: '벨타워', title: '현재의 벨타워', header: '200년 후, 같은 자리', dur: 6000,
        caption: '석조 시설과 굴뚝은 오늘날 <span class="gold">관광지</span>로 선명히 남아 있다' },
      { n: 'STEP 02', name: '설탕공장', title: '판화와 유적', header: '200년 후, 같은 자리', dur: 6000,
        caption: '생산시설은 돌로 지어졌고, <span class="gold">돌은 남았다</span>' },
      { n: 'STEP 03', name: 'Romney Manor', title: '관광지가 된 저택', header: '200년 후, 같은 자리', dur: 6000,
        caption: '그렇다면 — 그 옆에 <span class="red">점으로 찍혀 있던 집들</span>은 어디에 있는가' },
    ],
    apply(i) {
      [p1, p2, p3].forEach((p, k) => p.classList.toggle('on', k === i));
      tt.textContent = T[i][0]; ts.textContent = T[i][1];
    }
  });
</script>
</body>
</html>
