<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · 오늘의 명제 — 일과 건강의 역사와 AI</title>
<link rel="stylesheet" href="scene.css">
<style>
  .big { top: 44%; }
  .big .q { font-size: 40px; line-height: 1.5; }
  .big .q.last { color: var(--gold); font-size: 46px; margin-top: 4px; }
  .big .q.first::before { content: '“'; color: var(--dim); } .big .q.last::after { content: '”'; color: var(--dim); }
  .chs { position: absolute; left: 80px; right: 80px; bottom: 120px; z-index: 36; display: flex; justify-content: center; gap: 14px; }
  .chs .line { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line); background: rgba(12,19,28,.9); font: 600 16px var(--sans); }
  .chs .line .n { font: 700 11px var(--mono); color: var(--gold); letter-spacing: .1em; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="big lines" id="big">
    <div class="kick line">오늘의 명제</div>
    <div class="q line first">기계가 멈추든, 알고리즘이 꼬이든,</div>
    <div class="q line">시스템의 실패를 최종적으로 흡수해 온 것은</div>
    <div class="q line last">언제나 인간의 신체였다.</div>
  </div>
  <div class="chs lines" id="chs">
    <div class="line"><span class="n">01</span>역사</div><div class="line"><span class="n">02</span>루프</div><div class="line"><span class="n">03</span>데이터</div><div class="line"><span class="n">04</span>우리 학문의 과제</div>
  </div>

</div>

<script src="scene.js"></script>
<script>
  Scene.init({
    id: '07', meta: '들어가며', lit: 1,
    prev: 's06.html', next: 's08.html',
    steps: [
      { n: 'STEP 01', name: '명제', title: '천천히 읽는다', header: '오늘의 명제', dur: 8000,
        caption: '시스템이 실패했을 때, 그 실패의 비용을 <span class="gold">누가 지불하는가?</span>' },
      { n: 'STEP 02', name: '네 개의 장', title: '역사 · 루프 · 데이터 · 과제', header: '이 명제를 네 개의 장으로', dur: 5000,
        caption: '기계가 멈추면 사람이 손을 넣었고, 알고리즘이 틀리면 사람이 달렸다 — <span class="gold">네 개의 장</span>으로 풀어간다' },
    ],
    apply(i) {
      big.classList.add('show');
      chs.classList.toggle('show', i >= 1);
    }
  });
</script>
</body>
</html>
